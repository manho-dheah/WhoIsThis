<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#363367" />
  <title>منهو ذية | دخول الطلاب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="assets/manho-logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card brand-login-card">
      <div class="login-logo-frame">
        <img src="assets/manho-logo.jpg" alt="شعار منهو ذية" />
      </div>
      <span class="eyebrow gold-eyebrow">من الطلاب للطلاب</span>
      <h1 class="login-title">منهو ذية</h1>
      <p class="login-lead">تجارب طلابية تساعدك تعرف أسلوب عضو هيئة التدريس قبل بداية المقرر.</p>

      <form id="loginForm" class="login-form">
        <label for="password">كلمة الدخول</label>
        <div class="password-row">
          <input id="password" type="password" required autocomplete="current-password" placeholder="اكتب كلمة الدخول…" />
          <button class="primary-btn" type="submit">دخول</button>
        </div>
        <p id="loginMessage" class="form-message" aria-live="polite"></p>
      </form>

      <div class="login-note">
        <strong>خصوصيتك أولًا</strong>
        <span>لا تحتاج اسمًا أو حسابًا. التقييمات مجهولة، وتخضع لقواعد المجتمع.</span>
      </div>
    </section>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
